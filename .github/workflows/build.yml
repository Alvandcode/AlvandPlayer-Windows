name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run all tests (headless)
        run: .\gradlew.bat jvmTest --console=plain --no-daemon

      - name: Build distributable
        run: .\gradlew.bat :desktopApp:createDistributable --console=plain --no-daemon
