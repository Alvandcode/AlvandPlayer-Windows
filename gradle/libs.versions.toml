# این فایل نسخه‌های وابستگی‌ها را مدیریت می‌کند.
# به‌روزرسانی‌ها در اینجا انجام شده و در فایل‌های build.gradle.kts از طریق `libs.xxx` استفاده می‌شوند.

[versions]
kotlin = "2.2.21"
composeMultiplatform = "1.12.1"
coroutines = "1.10.2"
okhttp = "4.12.0"
sqliteJdbc = "3.53.4.0"
coil3 = "3.1.0"
jlayer = "1.0.1"
jflac = "1.5.2"
vorbisSupport = "1.2.1"
flacEncoder = "0.3.8"
jcodec = "0.2.5"
jaudiotagger = "3.0.1"
kotlinxSerialization = "1.8.0"
kotlinxDatetime = "0.6.1"
materialIcons = "1.7.3"

[libraries]
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
sqlite-jdbc = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqliteJdbc" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil3" }
jlayer = { group = "javazoom", name = "jlayer", version.ref = "jlayer" }
jflac = { group = "org.jflac", name = "jflac-codec", version.ref = "jflac" }
vorbis-support = { group = "com.github.trilarion", name = "java-vorbis-support", version.ref = "vorbisSupport" }
flac-encoder = { group = "com.github.axet", name = "java-flac-encoder", version.ref = "flacEncoder" }
jaudiotagger = { group = "net.jthink", name = "jaudiotagger", version = "3.0.1" }
jcodec = { group = "org.jcodec", name = "jcodec", version.ref = "jcodec" }
jna = { group = "net.java.dev.jna", name = "jna", version = "5.15.0" }
jna-platform = { group = "net.java.dev.jna", name = "jna-platform", version = "5.15.0" }
javasound-aac = { group = "com.tianscar.javasound", name = "javasound-aac", version = "0.9.8" }
javasound-alac = { group = "com.tianscar.javasound", name = "javasound-alac", version = "0.2.3" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinxDatetime" }
material-icons-core = { group = "org.jetbrains.compose.material", name = "material-icons-core", version.ref = "materialIcons" }
material-icons-extended = { group = "org.jetbrains.compose.material", name = "material-icons-extended", version.ref = "materialIcons" }
material3 = { group = "org.jetbrains.compose.material3", name = "material3", version.ref = "composeMultiplatform" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }